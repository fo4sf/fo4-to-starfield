; FO4SFBorder (sfse/FO4SFBorder/README.md). Goes next to FO4SFBorder.dll in Data\SFSE\Plugins.
[FO4SFBorder]
; 0 = loaded and idle (writes nothing), 1 = probe (finds and watches the setting, logs changes, never writes),
; 2 = switch (border off while FO4SF_MapMarkers says the player is in our world)
Mode=0
; the value byte's offset from the setting's name pointer (-16: the probe on 1.16.244, 2026-10-24)
ValueOffset=-16
; empty: Documents\My Games\Starfield\Logs\Script\User\fo4sf_map.0.log
SignalLog=
