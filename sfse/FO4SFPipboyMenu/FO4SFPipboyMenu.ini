; FO4SFPipboyMenu (FAL-187, FAL-216, FAL-272, FAL-301; README.md in this folder). Read once at load, next to the dll.
[FO4SFPipboyMenu]
; 0 = off (the plugin logs one line and stays idle), 1 = stage (a): the menu with no movie,
; 2 = stage (b): the menu showing Interface/FO4SF_PipboyMenu.swf from "FO4SFPipboyProbe - Main.ba2",
; 3 = stage (c): (b) plus the data channel (the movie staged with make_pipboy_probe.py stage --channel),
; 4 = stage (d): the STAT page (the movie staged with make_pipboy_probe.py stage --page)
; 5 = stage (e): the page kit, the pages in the [Kit] and [Page ...] sections below (the movie staged with
;     make_pipboy_probe.py stage --kit, from this file)
Stage=0
; FAL-614, Stage=2 only: the movie the menu loads, Interface/<Movie>.swf (1 to 64 letters, digits, _), instead of
; ours; empty = ours. For proof 1 of docs/spikes/pipboy-fo4-rebuild-plan.md: the player's own converted Fallout 4 movie,
; staged on their PC only, never in Git. Any other stage with Movie= set refuses (step=ini) and stays idle
Movie=
; FAL-614 proof 1b, with Movie= only: 1 sets a stand-in for the movie's engine object (root.BGSCodeObj) whose
; PlaySound and HideMenu each log one step=code_call line and do nothing else; 0 = none (proof 1 as it ran)
CodeObj=0
; with CodeObj=1: the stand-in's functions, 1 to 64 names (letters, digits, _), comma separated; empty = PlaySound,HideMenu
; (the stage INI generator scripts/ui/make_pipboy_stage_ini.py populates CodeObjNames= from the staged SWF movies)
CodeObjNames=
; with CodeObj=1: 1 makes the stand-in's HideMenu close our menu, as F10 does (it still logs); 0 = it only logs
CodeObjHide=0
; with CodeObj=1 and PlaySound among its names: 1 makes the stand-in's PlaySound play the player's own converted file
; FO4SFPipboyMenuSounds\<name>.wav beside the dll (PCM 16 bit WAVE, 1 or 2 channels; never in Git) through Windows
; audio, overlapping, not cut by closing the menu, not following the game's volume sliders; 0 = it only logs
CodeObjSound=0
; with CodeObj=1: the name of a function at the movie's root that the plugin calls once, with the stand-in as its one
; argument, right after the stand-in is set (a page loaded without its shell, proof 2a: InitCodeObj); empty = none
CodeObjInit=
; with CodeObj=1: up to 16 paths (root members, or members joined by .) read once after the hand-over and logged with
; their type, read-only (proof 2b step i); empty = none
CodeObjProbe=
; with CodeObj=1: up to 64 paths (root functions, or members joined by .) called once with no arguments after the
; hand-over and before CodeObjProbe (proof 2b step ii: onAcquiredByNativeCode); empty = none
CodeObjCalls=
; FAL-1025, with CodeObjAt= only: fill or clear <CodeObjAt>.DataObj.SPECIALList right before each InvalidateData the
; plugin calls (CodeObjCalls, CodeObjPages). The shell starts it as 7 empty objects and the STAT page's
; SPECIAL tab calls value.toString() on each (Gemini's PC read). fill = 7 entries (the name, player value,
; modifier 0, no description); clear = an empty list; empty = populated automatically for Menu_mc or left as made
CodeObjSpecial=
; FAL-614 S1-c, with CodeObj=1: one path (members joined by .) whose BGSCodeObj also gets the stand-in, the hand-over
; done only once it reads back there (the Fallout 4 shell's engine object is Menu_mc.BGSCodeObj); empty = the root only
CodeObjAt=
; with CodeObjAt= and onNewPage and onNewTab in CodeObjNames: 1 answers the movie's page and tab changes synchronously
; inside BGSCodeObj (<CodeObjAt>.DataObj.CurrentPage before CurrentTab, then <CodeObjAt>.InvalidateData());
; 0 = they only log
CodeObjPages=0
; Task 1 step 1b: 1 populates real player vitals & SPECIALList in-call inside PopulatePipboyInfoObj and calls InvalidateData once;
; 0 (default for 1a crash proof) keeps PopulatePipboyInfoObj as a logging stub and draws from kShow placeholder fill
PopulateInCall=0
LateInvalidate=0
; Round 10 C4 + Round 11 D7(b): opaque CRT backdrop + real HP/AP vitals on kShow + hide Starfield wrist watch
; (0 = one-line rollback without DLL rebuild); DataMenu/Tab opt-in stays off
ShellBackdrop=1
ShellVitalsFill=1
SuppressDataMenu=0
TabOpensPipboy=0
HideStarfieldWatch=1
; Task 1 steps 1j / 1k: gated off until THIS ROUND passes in game; Round 14 DATA pages + opt-in Jobs & HideMenus
StatActions=0
InvDataAnswers=0
DataPagesFill=0
ShowJobsGroup=0
JobsJson=FO4SFPipboyJobs.json
HidePowersMenu=0
HideAlmanacMenu=0
HideResearchMenu=0
HideShipCrewMenu=0
HideShipCrewAssignMenu=0
HideTakeoffMenu=0
HideShipRefuelMenu=0
HideWeaponGroupAssignmentMenu=0
; Task 4 step X2 / Task 1 step 1f: RequirePickup=0 keeps F7/M free for testing; BootMovie plays once on first open after pickup
RequirePickup=0
BootMovie=
BootOnFirstOpen=0
; Task 1 step 1k (UI-3): opt-in S.P.E.C.I.A.L. menu host (FO4SF_SpecialMenu), off by default
SpecialMenu=0
SpecialMovie=
SpecialMaxPoints=40
SpecialKey=0
; with CodeObj=1: up to 8 <key>:<path>, a virtual-key code and a path called with no arguments when it is pressed while
; the menu is open and the game in front (0x21:Menu_mc.gotoPrevPage); empty = none (open-menu keys route via ProcessUserEvent)
ShellKeys=
; FAL-852, the arm (S1-arm; README "The arm"), with Stage=2 and Movie= only: 0 = off (Key opens and closes the screen at
; once); 1 = Key plays the raise first (ArmRaiseIdle's animation event to the player) and opens the screen ArmRaiseMs
; after the graph took it, and every close of the screen (Key, or the movie's HideMenu with CodeObjHide=1) is followed by
; the lower. At Arm=1 Key is the screen's own key: not 0x79 (F10, the owner's faction device), 0x74 or 0x78 (F5, F9: the
; game's Quick Save and Quick Load) or WorldKey (refuse step=ini reason=arm_key)
Arm=0
; the raise idle's editor id (letters, digits, _): idleexaminewatch is the owner's choice (14 Nov, FAL-783)
ArmRaiseIdle=idleexaminewatch
; the raise's lead before the screen shows, in ms (0 to 6000): the wrist is face-on from about 1.9 s to 4.3 s of the clip
ArmRaiseMs=2000
; the lower, at most one of the two; both empty = nothing is sent, and the raise's own clip, held by the pause while the
; screen was up, carries on from its frame and lowers the arm by itself (PB-HOLD-1: about 5.5 s less ArmRaiseMs).
; ArmLowerIdle: an idle's editor id; ArmLowerEvent: a graph event by name (ActionInterrupt, as the console's sae sends it)
ArmLowerIdle=
ArmLowerEvent=
; Key is ignored this long after the close (no lower sent) or the accepted lower, in ms (0 to 6000)
ArmLowerMs=3500
; a raise or lower the player's graph refuses (result=0) is sent again every 100 ms for up to this long, in ms (0 to
; 6000; 0 = one send). A raise that is never taken (a gun drawn) still opens the screen ArmRaiseMs after it gave up
ArmRetryMs=2000
; the virtual-key code that opens and closes the menu (0x79 = F10)
Key=0x79
; stages (d) and (e), FAL-414: up to four keyboard ids that close the page while it is open and are not passed on to
; the game (Windows virtual-key codes: 0x1B = Esc, 0x09 = Tab; 0 = unused). The log's step=input line shows the id sent.
CancelCode1=0x1B
CancelCode2=0x09
CancelCode3=0
CancelCode4=0
; world surface (FAL-250; README "World surface"), with Stage=2: 0 = off (the log is #704's); 1 = the census of the
; engine's menus, and WorldKey sends show / hide to WorldMenu
World=0
; the key for WorldMenu (0x77 = F8); not the menu key
WorldKey=0x77
; one vanilla menu name from a step=census_registered line (letters, digits, _); empty = census only
WorldMenu=
; the twin's path that make_pipboy_probe.py twin staged (Interface/<file>), for the log only; empty = none
WorldMovie=
; Pip-Boy MAP controller (Slices 1-4; docs/ui/pipboy-map-s1-s4.md), with Stage=2, Movie= and CodeObj=1: 0 = off (as
; shipped); 1 = MapKey opens FO4SF_PipboyMenu on MapPage, suppresses Starfield's star map via hide-only default
; (MapBlockStarMap=0, proven outdoor M-key safe; MapBlockStarMap=1 replaces initFunc with a non-null self-hiding minimal IMenu),
; swallows MapKey while open so M never loops, feeds world texture/markers/live engine discovered state into DataObj,
; and dispatches MapTravelScript on FastTravel. Offsets below default to the PC-verified 1.16.244 slots and may be
; overridden without recompiling (MapHeadingAt empty = uses [Kit] HeadingAt; MapGlobalValueAt 0 = ChooseGlobalSlot)
Map=0
MapKey=0x4D
MapPage=3
MapMenus=GalaxyStarMapMenu
MapBlockStarMap=0
MapStore=FO4SFPipboyMapMarkers.tsv
MapTravelPlugin=FO4SFPipboyTravel.esm
MapTravelScript=FO4SF_PipboyTravel.Go
MapSurvival=0
MapHeadingAt=88
MapGlobalValueAt=0
MapGameHourId=0x38
MapGameDaysPassedId=0x39
MapFileCollectionAt=0x1580
MapFileNameAt=0x38
MapFileCompileIndexAt=0x1B7
MapFileIndexAt=0x218
MapExtraListAt=0xC8
MapMarkerFlagsAt=0x18
MapMarkerDiscoveredMask=0x20
; extra IMenu flags OR'ed into the ones the engine's constructor set (0 = none)
Flags=0
; 1 = hold one extra reference on each menu object the plugin creates, so the engine never frees it
; (the count a public precedent uses); 0 = the engine's own count only
KeepAlive=1
; stage (c) only: up to four flag sets, one per open in turn (open k uses entry (k - 1) mod count), OR'ed like Flags.
; 0x0 = the constructor's own; 0x8 = libxse's ShowCursor (bit 3); 0x9 = ShowCursor + bit 0 (Fallout 4's
; "pauses game" bit; unverified in Starfield: the log's paused= says)
FlagSets=0x0,0x8,0x9
; stages (d) and (e): the flag sets of the page's opens, as FlagSets (0x9 = ShowCursor + bit 0: the set at which the
; FAL-216 clicks reached our menu; FlagSets is not read at stages (d) and (e))
PageFlagSets=0x19
; 0x19 = ShowCursor (0x8) + bit 0 + bit 4 (0x10). PC sweep of #738 at 14176a5e: bit 4 puts StopContextProcessing (78) on the
; control map's stack, which makes Tab and Esc arrive as Cancel; bit 1 (0x2) pauses the game; bit 8 (0x100) blanks the world.
; FAL-414 flag sweep (up to 16 sets, one per open, repeating): the game's menus get their input contexts (78 =
; StopContextProcessing and 2 = BasicMenuNav above the gameplay ones) from something; ShowCursor (0x8) is what added
; context 13. To find the flag: open and close the page once per entry, F11 after each open, and read the contexts= of
; each step=snapshot tag=main_after_open (the step=flags line before it names the set). libxse's IMenu::Flag bits:
; 0,1,3,4,6,8,9,10,18,25,27. Example, 0x9 plus each one in turn (bits 0 and 3 are already in 0x9):
; PageFlagSets=0x9,0xB,0x19,0x49,0x109,0x209,0x409,0x40009,0x2000009,0x8000009
; stages (d) and (e), the owner's setting (FAL-446): 0 = the game runs behind the Pip-Boy (as shipped); 1 = it pauses
; (adds bit 1, 0x2, to every PageFlagSets entry: the bit that paused the game in the PC's sweep at 14176a5e).
; FAL-852: also read at Stage=2 with Movie= (Fallout 4's screen), where 1 adds the same bit to Flags
Pause=0
; stages (c) to (e): the key that logs a snapshot (pause state, open menus, input contexts) on the main thread
; (0x7A = F11; 0 = none)
SnapshotKey=0x7A
; stage (c) only (FAL-246): <script>.<function>, a global Papyrus function with no arguments that the plugin asks the
; script VM to run after each click on the movie's button (FOCC_B0.Click, the combined probe kit's, logs "b0 click"
; through its probe quest); empty = no call
ClickCall=

; stage (e) only: the kit's keys, up to three virtual-key codes each, read while the page is open and the game in
; front (Up/W, Down/S: the selection, held to repeat; Left/A, Right/D: the sub-tab; Q, E: the main tab). Not Key or
; SnapshotKey. 0x09 (Tab) may be added; what the game itself does with each key at PageFlagSets is the session's finding
KitUp=0x26,0x57
KitDown=0x28,0x53
KitPrevSub=0x25,0x41
KitNextSub=0x27,0x44
KitPrevTab=0x51
KitNextTab=0x45

; ---------------------------------------------------------------------------------------------- the kit's pages
; Stage (e) (FAL-301): every page of the kit, as data. Read by the plugin at load and by
; scripts/ui/make_pipboy_kit.py, which draws the main tabs from it (re-stage with --kit after a change). A page:
;   [Page <TAB>/<SUB>]       its main tab and sub-tab; main tabs come in the order of their first page (up to 5),
;                            sub-tabs in the order of their pages (up to 5 per tab)
;   Row=<label>|<value>      a list row and its value (any number up to 64; 16 on screen, scrolled), or
;   List=<list>              the rows from a list provider (kit_test, inventory, quests), or
;   Notice=<text>            a line of a placeholder page (up to 16)
;   Footer=<label>|<value>   a footer cell (up to 3); Hint=<text> the key hints on this page
; Values: health, level, xp, carry_max, rads, cell, world, time, days, position, or av:<hex> (an actor value by its
; form id: av:2C2 is Starfield.esm's Strength). Labels: upper case, the kit font's characters (A-Z 0-9 space and
; ! # % & ' ( ) * + , - . / : ; < = > ? [ ] _), at most 33 for a row, 9 for a tab, 13 for a sub-tab, 10 for a footer
; cell. A wrong line stops the kit: refuse step=pages line=<n> reason=<r>. [Kit] Mission=<plugin file>|<local id hex>:
; our mission, the first row of List=quests (FO4SFMission.esm's FO4SF_Min00 "When Freedom Calls" is local id 800).
; [Kit] MissionStageAt=<hex offset>: where the mission keeps its current stage (a u16, even, 38 to 336), the line
; scripts/ui/pipboy_quest_bytes.py prints from two F11 dumps; without it the quest's STAGE shows ? (FAL-527).
; [Kit] MissionObjective=<n>|<path>, up to 8 lines: objective <n>'s state, the byte at the end of <path> (2 or 3 hex
; offsets joined by /: a pointer read at each but the last), the line pipboy_quest_bytes.py --objective <n> prints;
; without any the page walks the mission's objectives itself (FAL-571; README, quests)
; [Kit] HeadingAt=[-]<80, 84 or 88>: the player's angle float that is the heading ('-' when it falls as the player
; turns right), the line scripts/ui/pipboy_map_bytes.py prints from two F11 dumps around a turn; without it MAP's
; HEADING shows ? (FAL-595; 88 verified on the PC, 12 Nov: player.setangle z 0 then 90 moved +088 from 0 to 1.5708).
; [Kit] GridUnits=<decimal>: a cell's width in game units (1 to 65536), the line pipboy_map_bytes.py --grid prints
; when the cell's own grid matches POSITION over it in two cells; without it GRID shows ? (100 verified on the PC, 12 Nov:
; cell_x and cell_y were x and y over 100, and modpos y 60 crossed from cell_y -16 to -15)
[Kit]
Title=FO4SF PIP-BOY
Header=time
Hints=[W/S] SELECT  [A/D] SUB-TAB  [Q/E] TAB  [F10] CLOSE
Mission=FO4SFMission.esm|800
HeadingAt=88
GridUnits=100

